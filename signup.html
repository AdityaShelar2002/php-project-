<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 100%;
            max-width: 550px;
        }

        .form-card {
            background: #ffffff;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header h1 {
            color: #222;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .form-header p {
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="url"],
        textarea {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #d6d6d6;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
            background: #fafafa;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="url"]:focus,
        textarea:focus {
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        .gender-options {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .gender-option {
            display: flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
            color: #444;
        }

        .gender-option input {
            accent-color: #667eea;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .required {
            color: #e63946;
        }

        /* Tablet */
        @media (max-width: 600px) {
            .form-card {
                padding: 28px 22px;
            }

            .form-header h1 {
                font-size: 26px;
            }
        }

        /* Mobile */
        @media (max-width: 400px) {
            body {
                padding: 15px 10px;
            }

            .form-card {
                padding: 24px 18px;
                border-radius: 14px;
            }

            .form-header h1 {
                font-size: 24px;
            }

            .gender-options {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="form-card">

            <div class="form-header">
                <h1>✨ Create Account</h1>
                <p>Fill in the details below to register</p>
            </div>

            <form action="submit.php" method="post">

                <div class="form-group">
                    <label for="name">
                        Name <span class="required">*</span>
                    </label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">
                        Email <span class="required">*</span>
                    </label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@gmail.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="website">Website</label>
                    <input
                        type="url"
                        id="website"
                        name="website"
                        placeholder="https://example.com"
                    >
                </div>

                <div class="form-group">
                    <label for="comment">Comment</label>
                    <textarea
                        id="comment"
                        name="comment"
                        placeholder="Write your comment here..."
                    ></textarea>
                </div>

                <div class="form-group">
                    <label>
                        Gender <span class="required">*</span>
                    </label>

                    <div class="gender-options">

                        <label class="gender-option">
                            <input
                                type="radio"
                                name="gender"
                                value="female"
                                required
                            >
                            Female
                        </label>

                        <label class="gender-option">
                            <input
                                type="radio"
                                name="gender"
                                value="male"
                            >
                            Male
                        </label>

                        <label class="gender-option">
                            <input
                                type="radio"
                                name="gender"
                                value="other"
                            >
                            Other
                        </label>

                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    Submit Registration
                </button>

            </form>

        </div>

    </div>

</body>
</html>
